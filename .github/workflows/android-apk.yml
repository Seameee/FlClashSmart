name: android-apk

# The unit tests never compile Kotlin, the NDK, or gomobile's Core binding, so a
# broken arm64 build only shows up here. This job builds the debug APK a preview
# branch is tested from and keeps it as an artifact.

on:
  push:
    branches:
      - smart
      - 'smart-**'
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.6'
  GO_VERSION: '1.27.1'
  NDK_VERSION: r28c

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arm64:
    name: arm64 debug APK
    # A private copy pays for its Actions minutes, so it builds only when started
    # by hand.
    if: github.event_name == 'workflow_dispatch' || !github.event.repository.private
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Setup NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugins/rust_api/rust
          cache-directories: .dart_tool/hooks_runner

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # --split-per-abi is what makes the artifact one ABI: a plain debug build
      # packs every ABI Flutter ships, whatever --target-platform says.
      - name: Build arm64 debug APK
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          flutter build apk --debug --target-platform android-arm64 --split-per-abi
          ls -l build/app/outputs/flutter-apk/

      # A missing Core, or a Helper built for another ABI, is exactly what this
      # job exists to catch: both only fail at runtime otherwise.
      - name: Verify the APK holds one aarch64 ABI
        run: |
          apks=(build/app/outputs/flutter-apk/app-*-debug.apk)
          test "${#apks[@]}" -eq 1
          apk="${apks[0]}"
          echo "APK: $apk"
          test -f "$apk"
          abis="$(unzip -Z1 "$apk" | sed -n 's|^lib/\([^/]*\)/.*|\1|p' | sort -u)"
          echo "ABIs: $abis"
          test "$abis" = arm64-v8a
          for so in libclash librust_api; do
            unzip -p "$apk" "lib/arm64-v8a/$so.so" > "/tmp/$so.so"
            file "/tmp/$so.so"
            file "/tmp/$so.so" | grep -q 'ARM aarch64'
          done

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: android-arm64-debug-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
          if-no-files-found: error
